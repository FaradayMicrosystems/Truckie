name: Android build

on:
  push:
    branches: [main, experimental]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Signing: the permanent key in signing/ (committed on purpose, private repo) signs every build.
      # Optional repository secret:
      #   UPDATE_TOKEN  read-only token for the in-app update check while the repo is private
      - name: Write update token
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          : > local.properties
          if [ -f signing/shared.keystore ]; then SIGN="shared Truckie key (updates install over each other)"; else SIGN="throwaway debug key: uninstall the old version first"; fi
          if [ -n "$UPDATE_TOKEN" ]; then echo "UPDATE_TOKEN=$UPDATE_TOKEN" >> local.properties; TOK="built in"; else TOK="not set"; fi
          echo "BUILD_STATUS=Signed with: $SIGN. Update-check token: $TOK." >> "$GITHUB_ENV"
          echo "Signing: $SIGN / token: $TOK"

      - name: Unit tests
        run: ./gradlew :core:test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: truckie-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Release channels (see README "Releases"):
      #   main          stable. Its version ("0.5.3") publishes as the full release v0.5.3, which the in-app
      #                 update check on stable installs finds. main never carries an a/b/c letter.
      #   experimental  every push publishes a pre-release v0.5.3a+<build> (a alpha, b beta, c release
      #                 candidate). Stable installs never see these.
      - name: Publish release
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/experimental') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          BASE=$(sed -n 's/^val baseVersionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          [ -n "$BASE" ] || { echo "::error::baseVersionName not found in app/build.gradle.kts"; exit 1; }
          case "$BASE" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::version must be X.Y.Z with an optional a/b/c, found $BASE"; exit 1 ;; esac
          STABLE="${BASE%[abc]}"
          # Release notes: the CHANGELOG section for this version ("## v0.6 — ...").
          awk -v h="## v$STABLE " 'index($0, h) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          printf '\n%s\n' "$BUILD_STATUS" >> notes.md

          if [ "$BRANCH" = "experimental" ]; then
            case "$BASE" in *[abc]) ;; *) echo "::error::experimental must build an a/b/c version (e.g. 0.5.3a), found $BASE"; exit 1 ;; esac
            TAG="v$BASE+$GITHUB_RUN_NUMBER"
            APK="truckie-v$BASE-build$GITHUB_RUN_NUMBER.apk"   # no "+" in file names
            cp app/build/outputs/apk/debug/app-debug.apk "$APK"
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Truckie $TAG (experimental)" --notes-file notes.md
            # One fixed link that always holds the newest experimental APK:
            # https://github.com/FaradayMicrosystems/truckie/releases/download/experimental/truckie-experimental.apk
            cp "$APK" truckie-experimental.apk
            if gh release view experimental > /dev/null 2>&1; then
              gh release upload experimental truckie-experimental.apk --clobber
              gh release edit experimental --title "Experimental: newest build ($TAG)" --notes "Newest experimental build, $TAG. Same file as that release. $BUILD_STATUS"
            else
              gh release create experimental truckie-experimental.apk --target "$GITHUB_SHA" --prerelease --latest=false \
                --title "Experimental: newest build ($TAG)" --notes "Newest experimental build, $TAG. Same file as that release. $BUILD_STATUS"
            fi
            exit 0
          fi

          case "$BASE" in *[abc]) echo "::error::main holds stable releases only; drop the a/b/c letter before a full release (found $BASE)"; exit 1 ;; esac
          TAG="v$BASE"
          cp app/build/outputs/apk/debug/app-debug.apk "truckie-$TAG.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "truckie-$TAG.apk" --clobber
            gh release edit "$TAG" --notes-file notes.md
            exit 0
          fi
          gh release create "$TAG" "truckie-$TAG.apk" --target "$GITHUB_SHA" --latest \
            --title "Truckie $TAG" --notes-file notes.md
