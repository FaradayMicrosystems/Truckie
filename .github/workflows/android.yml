name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Signing: the permanent key in signing/ (committed on purpose, private repo) signs every build.
      # Optional repository secret:
      #   UPDATE_TOKEN  read-only token for the in-app update check while the repo is private
      - name: Write update token
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          : > local.properties
          if [ -f signing/shared.keystore ]; then SIGN="shared Truckie key (updates install over each other)"; else SIGN="throwaway debug key: uninstall the old version first"; fi
          if [ -n "$UPDATE_TOKEN" ]; then echo "UPDATE_TOKEN=$UPDATE_TOKEN" >> local.properties; TOK="built in"; else TOK="not set"; fi
          echo "BUILD_STATUS=Signed with: $SIGN. Update-check token: $TOK." >> "$GITHUB_ENV"
          echo "Signing: $SIGN / token: $TOK"

      - name: Unit tests
        run: ./gradlew :core:test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: truckie-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Every push to main replaces the "latest" pre-release, so this link always has the newest APK:
      # https://github.com/FaradayMicrosystems/truckie/releases/download/latest/truckie-debug.apk
      - name: Publish latest APK
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk truckie-debug.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest truckie-debug.apk --target "$GITHUB_SHA" --prerelease \
            --title "Latest build (${GITHUB_SHA::7})" \
            --notes "Debug build of main. Open the .apk on an Android 8.0+ phone and allow installs from this source when asked. $BUILD_STATUS"

      # A new versionName publishes a full release, named and noted from CHANGELOG.md.
      # The app's update check looks at this release. Re-running for an existing version replaces its APK.
      - name: Publish versioned release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          TAG="v$VERSION"
          awk -v h="## $TAG" 'index($0, h) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          printf '\n%s\n' "$BUILD_STATUS" >> notes.md
          cp app/build/outputs/apk/debug/app-debug.apk "truckie-$TAG.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "truckie-$TAG.apk" --clobber
            gh release edit "$TAG" --notes-file notes.md
            exit 0
          fi
          gh release create "$TAG" "truckie-$TAG.apk" --target "$GITHUB_SHA" --latest \
            --title "Truckie $TAG" --notes-file notes.md
